name: validate-handbook
"on": [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r examples/python/requirements.txt platformio==6.1.18
      - name: Read-only host inventory (no physical experiment)
        run: python scripts/hardware_preflight.py --output "${{ runner.temp }}/handbook-validation/preflight.json"
      - run: python scripts/check_handbook.py
      - run: python -m unittest discover -s examples/python/tests -v
      - name: Configure desktop C++ model tests
        run: cmake -S examples/arduino/language_basics -B "${{ runner.temp }}/handbook-cpp"
      - name: Build desktop C++ model tests
        run: cmake --build "${{ runner.temp }}/handbook-cpp" --config Release
      - name: Run desktop C++ model tests
        run: ctest --test-dir "${{ runner.temp }}/handbook-cpp" -C Release --output-on-failure
      - name: Build all Arduino examples
        env:
          PLATFORMIO_CORE_DIR: ${{ runner.temp }}/pio-core
        run: python scripts/build_examples.py --kind arduino --build-root "${{ runner.temp }}/handbook-pio" --output "${{ runner.temp }}/handbook-validation/arduino.json"
      - name: Verify Arduino binary sizes and 4 MiB partitions
        if: ${{ !cancelled() }}
        run: python scripts/check_firmware_sizes.py --build-root "${{ runner.temp }}/handbook-pio" --output "${{ runner.temp }}/handbook-validation/arduino-sizes.json"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: validation-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/handbook-validation/
          if-no-files-found: warn
          retention-days: 14
  idf:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build native ESP-IDF examples in fresh directories
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python scripts/build_idf_native.py --work-root /tmp/handbook-idf --output "${{ runner.temp }}/handbook-validation/idf.json"
      - name: Verify IDF binary sizes and 4 MiB partitions
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python scripts/check_idf_sizes.py --build-root /tmp/handbook-idf/builds --output "${{ runner.temp }}/handbook-validation/idf-sizes.json"
      - name: Build OTA with public nonempty network settings (never flashed)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python scripts/build_idf_native.py --match ota --work-root /tmp/handbook-idf-ota --defaults-overlay validation/ota-build-only.defaults --output "${{ runner.temp }}/handbook-validation/ota/idf.json"
      - name: Verify configured OTA fits both slots
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python scripts/check_idf_sizes.py --match ota --build-root /tmp/handbook-idf-ota/builds --output "${{ runner.temp }}/handbook-validation/ota/sizes.json"
      - name: Compile OTA self-test failure branch (no hardware rollback test)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python scripts/build_idf_native.py --match ota --work-root /tmp/handbook-idf-ota-fail --defaults-overlay validation/windows-repair/ota-selftest-fail.defaults --output "${{ runner.temp }}/handbook-validation/ota-fail/idf.json"
          python scripts/check_idf_sizes.py --match ota --build-root /tmp/handbook-idf-ota-fail/builds --output "${{ runner.temp }}/handbook-validation/ota-fail/sizes.json"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: validation-idf-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/handbook-validation/
          if-no-files-found: warn
          retention-days: 14
